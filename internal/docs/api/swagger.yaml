definitions:
  AccessRequest:
    properties:
      all_stations:
        type: boolean
      all_variables:
        type: boolean
      created_at:
        type: string
      id:
        type: integer
      max_days_history:
        type: integer
      reason:
        type: string
      review_note:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: integer
      station_ids:
        items:
          type: integer
        type: array
      status:
        type: string
      user_id:
        type: integer
      variables:
        items:
          type: string
        type: array
    type: object
  CSIMisolParams:
    properties:
      weather:
        type: string
    required:
    - weather
    type: object
  CreateAccessRequestParams:
    properties:
      all_stations:
        type: boolean
      all_variables:
        type: boolean
      max_days_history:
        type: integer
      reason:
        type: string
      station_ids:
        items:
          type: integer
        type: array
      variables:
        items:
          type: string
        type: array
    type: object
  CreateRoleParams:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  CreateStationObservationReq:
    properties:
      hi:
        type: number
      mslp:
        type: number
      pres:
        type: number
      qc_level:
        type: integer
      rh:
        type: number
      rr:
        type: number
      srad:
        type: number
      station_id:
        type: integer
      td:
        type: number
      temp:
        type: number
      timestamp:
        type: string
      wchill:
        type: number
      wdir:
        type: number
      wspd:
        type: number
      wspdx:
        type: number
    type: object
  CreateStationReq:
    properties:
      address:
        type: string
      date_installed:
        type: string
      elevation:
        type: number
      lat:
        type: number
      lon:
        type: number
      mobile_number:
        type: string
      name:
        type: string
      province:
        type: string
      region:
        type: string
      station_type:
        type: string
      station_type2:
        type: string
      station_url:
        type: string
      status:
        type: string
    required:
    - name
    type: object
  CreateUserParams:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    required:
    - email
    - full_name
    - password
    - username
    type: object
  GlobeLabsLoadResponse:
    properties:
      created_at:
        type: string
      mobile_number:
        type: string
      promo:
        type: string
      status:
        type: string
      transaction_id:
        type: integer
    type: object
  GlobeLabsOptInResponse:
    properties:
      access_token:
        type: string
      is_created:
        type: boolean
      mobile_number:
        type: string
      type:
        type: string
    type: object
  LatestObservation:
    properties:
      address:
        type: string
      elevation:
        type: number
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      name:
        type: string
      obs:
        $ref: '#/definitions/handlers.latestObsRes'
    type: object
  LoginUserParams:
    properties:
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  LufftSMSParams:
    properties:
      msg:
        type: string
      number:
        type: string
    required:
    - msg
    - number
    type: object
  ObservationResponse:
    properties:
      health:
        $ref: '#/definitions/StationHealth'
      observation:
        $ref: '#/definitions/StationObservation'
      station:
        $ref: '#/definitions/Station'
    type: object
  PaginatedAccessRequests:
    type: object
  PaginatedRoles:
    type: object
  PaginatedStationObservations:
    type: object
  PaginatedStations:
    type: object
  PaginatedUsers:
    type: object
  RegisterUserParams:
    properties:
      confirm_password:
        minLength: 6
        type: string
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - confirm_password
    - email
    - full_name
    - password
    - username
    type: object
  RenewAccessTokenParams:
    properties:
      refresh_token:
        type: string
    type: object
  ReviewAccessRequestParams:
    properties:
      all_stations:
        type: boolean
      all_variables:
        type: boolean
      max_days_history:
        type: integer
      note:
        type: string
      station_ids:
        items:
          type: integer
        type: array
      variables:
        items:
          type: string
        type: array
    type: object
  ReviewUserParams:
    properties:
      note:
        type: string
    type: object
  Role:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  Station:
    properties:
      address:
        type: string
      date_installed:
        type: string
      elevation:
        type: number
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      mobile_number:
        type: string
      name:
        type: string
      province:
        type: string
      region:
        type: string
      station_type:
        type: string
      station_type2:
        type: string
      station_url:
        type: string
      status:
        type: string
    type: object
  StationHealth:
    properties:
      bp1:
        type: number
      bp2:
        type: number
      cm:
        type: string
      curr:
        type: number
      data_count:
        type: integer
      data_status:
        type: string
      error_msg:
        type: string
      fpm:
        type: string
      id:
        type: integer
      message:
        type: string
      rh_arq:
        type: number
      ss:
        type: integer
      station_id:
        type: integer
      temp_arq:
        type: number
      timestamp:
        type: string
      vb1:
        type: number
      vb2:
        type: number
    type: object
  StationObservation:
    properties:
      hi:
        type: number
      id:
        type: integer
      mslp:
        type: number
      pres:
        type: number
      qc_level:
        type: integer
      rh:
        type: number
      rr:
        type: number
      srad:
        type: number
      station_id:
        type: integer
      td:
        type: number
      temp:
        type: number
      timestamp:
        type: string
      wchill:
        type: number
      wdir:
        type: number
      wspd:
        type: number
      wspdx:
        type: number
    type: object
  StationStats:
    properties:
      offline:
        type: integer
      online:
        type: integer
      reporting:
        type: integer
      total:
        type: integer
      window_seconds:
        type: integer
    type: object
  UpdateProfileParams:
    properties:
      current_password:
        minLength: 6
        type: string
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        type: string
    required:
    - current_password
    type: object
  UpdateRoleParams:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  UpdateStationObservationParams:
    properties:
      hi:
        type: number
      id:
        type: integer
      mslp:
        type: number
      pres:
        type: number
      qc_level:
        type: integer
      rh:
        type: number
      rr:
        type: number
      srad:
        type: number
      station_id:
        type: integer
      td:
        type: number
      temp:
        type: number
      timestamp:
        type: string
      wchill:
        type: number
      wdir:
        type: number
      wspd:
        type: number
      wspdx:
        type: number
    type: object
  UpdateStationReq:
    properties:
      address:
        type: string
      date_installed:
        type: string
      elevation:
        type: number
      id:
        format: int64
        type: integer
      lat:
        type: number
      lon:
        type: number
      mobile_number:
        type: string
      name:
        type: string
      province:
        type: string
      region:
        type: string
      station_type:
        type: string
      station_type2:
        type: string
      station_url:
        type: string
      status:
        type: string
    type: object
  UpdateUserAccessParams:
    properties:
      all_stations:
        type: boolean
      all_variables:
        type: boolean
      max_days_history:
        type: integer
      station_ids:
        items:
          type: integer
        type: array
      variables:
        items:
          type: string
        type: array
    type: object
  UpdateUserParams:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      roles:
        items:
          type: string
        type: array
    type: object
  User:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      password_changed_at:
        type: string
      review_note:
        type: string
      reviewed_at:
        type: string
      reviewed_by:
        type: integer
      roles:
        items:
          type: string
        type: array
      status:
        type: string
      username:
        type: string
    type: object
  UserAccess:
    properties:
      max_days_history:
        type: integer
      station_ids:
        items:
          type: integer
        type: array
      updated_at:
        type: string
      user_id:
        type: integer
      variables:
        items:
          type: string
        type: array
    type: object
  handlers.latestObsRes:
    properties:
      gust:
        type: number
      gust_timestamp:
        type: string
      mslp:
        type: number
      rain:
        type: number
      rain_accum:
        type: number
      rh:
        type: number
      srad:
        type: number
      temp:
        type: number
      timestamp:
        type: string
      tn:
        type: number
      tn_timestamp:
        type: string
      tx:
        type: number
      tx_timestamp:
        type: string
      wdir:
        type: number
      wspd:
        type: number
    type: object
  handlers.paginatedLufftMsgLogs:
    type: object
  models.APIToken:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/models.APITokenPermissions'
      token_prefix:
        type: string
      user_id:
        type: integer
    type: object
  models.APITokenPermissions:
    properties:
      max_days_history:
        description: -1 means unlimited, 0 means the default (365)
        type: integer
      station_ids:
        description: null means all stations
        items:
          type: integer
        type: array
      variables:
        description: null means all variables
        items:
          type: string
        type: array
    type: object
  models.APITokenWithSecret:
    properties:
      created_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/models.APITokenPermissions'
      token:
        type: string
      token_prefix:
        type: string
      user_id:
        type: integer
    type: object
  models.CreateAPITokenReq:
    properties:
      expires_at:
        type: string
      name:
        type: string
      permissions:
        $ref: '#/definitions/models.APITokenPermissions'
    required:
    - name
    type: object
info:
  contact:
    email: emiliogozo@proton.me
    name: Emilio Gozo
  description: Panahon API.
  title: Panahon API
  version: "1.0"
paths:
  /access-requests:
    get:
      parameters:
      - in: query
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - enum:
        - pending
        - approved
        - denied
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedAccessRequests'
      security:
      - BearerAuth: []
      summary: List access requests
      tags:
      - access
  /access-requests/{id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Optional partial approval / note
        in: body
        name: req
        schema:
          $ref: '#/definitions/ReviewAccessRequestParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserAccess'
      security:
      - BearerAuth: []
      summary: Approve an access request (optionally a subset)
      tags:
      - access
  /access-requests/{id}/deny:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Denial (note required)
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/ReviewAccessRequestParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/AccessRequest'
      security:
      - BearerAuth: []
      summary: Deny an access request
      tags:
      - access
  /csi:
    post:
      consumes:
      - application/json
      parameters:
      - description: Circuit Solutions Misol parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/CSIMisolParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ObservationResponse'
      summary: Store Misol observation and health
      tags:
      - csi
      - misol
  /glabs:
    get:
      consumes:
      - application/json
      parameters:
      - in: query
        name: access_token
        type: string
      - in: query
        name: code
        type: string
      - in: query
        name: subscriber_number
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GlobeLabsOptInResponse'
      summary: Globe Labs opt-in
      tags:
      - globelabs
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Globe Labs unsubscribe
      tags:
      - globelabs
  /glabs/load:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GlobeLabsLoadResponse'
      summary: Create Globe Labs entry
      tags:
      - globelabs
  /lufft/{station_id}/logs:
    get:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      - in: query
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 30
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.paginatedLufftMsgLogs'
      summary: Lufft Message Logs
      tags:
      - lufft
  /observations:
    get:
      parameters:
      - in: query
        name: end_date
        type: string
      - description: page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: limit
        in: query
        maximum: 50000
        minimum: 5
        name: per_page
        type: integer
      - in: query
        name: start_date
        type: string
      - in: query
        name: station_ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedStationObservations'
      security:
      - APITokenAuth: []
      - BearerAuth: []
      summary: list station observation
      tags:
      - observations
  /observations/latest:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/LatestObservation'
            type: array
      summary: list latest observation
      tags:
      - observations
  /roles:
    get:
      consumes:
      - application/json
      parameters:
      - in: query
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 30
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedRoles'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - roles
  /roles/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - roles
    get:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Role'
      security:
      - BearerAuth: []
      summary: Get role
      tags:
      - roles
    post:
      consumes:
      - application/json
      parameters:
      - description: Create role parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/CreateRoleParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Role'
      security:
      - BearerAuth: []
      summary: Create role
      tags:
      - roles
    put:
      consumes:
      - application/json
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update role parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/UpdateRoleParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Role'
      security:
      - BearerAuth: []
      summary: Update role
      tags:
      - roles
  /sms:
    post:
      consumes:
      - application/json
      parameters:
      - description: SMS parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/LufftSMSParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ObservationResponse'
      summary: Store Lufft observation and health
      tags:
      - sms
  /stations:
    get:
      consumes:
      - application/json
      parameters:
      - description: restrict to the caller's entitlement
        in: query
        name: accessible
        type: boolean
      - in: query
        name: bbox
        type: string
      - in: query
        name: circle
        type: string
      - description: page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: limit
        in: query
        minimum: 1
        name: per_page
        type: integer
      - in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedStations'
      security:
      - BearerAuth: []
      summary: List stations
      tags:
      - stations
    post:
      consumes:
      - application/json
      parameters:
      - description: Create station parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/CreateStationReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Station'
      security:
      - BearerAuth: []
      summary: Create station
      tags:
      - stations
  /stations/{station_id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete station
      tags:
      - stations
    get:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Station'
      summary: Get station
      tags:
      - stations
    put:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      - description: Update station parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/UpdateStationReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Station'
      security:
      - BearerAuth: []
      summary: Update station
      tags:
      - stations
  /stations/{station_id}/observations:
    get:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      - in: query
        name: end_date
        type: string
      - description: page number
        in: query
        minimum: 1
        name: page
        type: integer
      - description: limit
        in: query
        minimum: 1
        name: per_page
        type: integer
      - in: query
        name: start_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PaginatedStationObservations'
      security:
      - APITokenAuth: []
      - BearerAuth: []
      summary: List station observations
      tags:
      - observations
    post:
      consumes:
      - application/json
      parameters:
      - description: Station ID
        in: path
        name: station_id
        required: true
        type: integer
      - description: Create station observation parameters
        in: body
        name: stnObs
        required: true
        schema:
          $ref: '#/definitions/CreateStationObservationReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/StationObservation'
      security:
      - BearerAuth: []
      summary: Create station observation
      tags:
      - observations
  /stations/{station_id}/observations/{id}:
    delete:
