name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare test config
        run: |
          cp app.env.example app.env
          cp app_conf.yaml.example app_conf.yaml

      - name: Build
        run: go build ./...

      - name: Test
        run: make test
