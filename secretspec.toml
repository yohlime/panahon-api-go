[project]
name = "panahon-api-go"
revision = "1.0"
# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[providers]
local = "dotenv"

[defaults]
provider = "dotenv"

[profiles.default]
DB_UI_DEV = { description = "DB_UI_DEV secret", required = true }
PG_PORT = { description = "PG_PORT secret", required = true }
PG_DB_NAME = { description = "PG_DB_NAME secret", required = true }
PG_DB_USER = { description = "PG_DB_USER secret", required = true }
PG_DB_PASSWORD = { description = "PG_DB_PASSWORD secret", required = true }
PG_HOST = { description = "PG_HOST secret", required = true }
PG_DB_PASSWORD_ENC = { description = "PG_DB_PASSWORD_ENC secret", required = true }
# DATABASE_URL = { description = "Database connection string", required = true }
POTEKA_API_KEY = { description = "Poteka API key", required = true }

[profiles.dev]
ADMIN_PASSWORD = { description = "API admin password", required = true, ref = { item = "API_ADMIN_PASSWORD" } }

[profiles.prod]
ADMIN_PASSWORD = { description = "API admin password", required = true }
